<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123f45">

  <title>Group Kingsbury — Mini Games</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 20% 0%, rgba(244,196,78,.18), transparent 30%),
        linear-gradient(145deg, #0d3035, #174c52 50%, #0b292e);
    }

    .container {
      width: min(1100px, 94%);
      margin: auto;
      padding: 25px 0 40px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    .small-title {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-weight: bold;
      opacity: .8;
    }

    h1 {
      margin: 5px 0;
      font-size: clamp(40px, 8vw, 78px);
      line-height: .95;
      letter-spacing: -3px;
    }

    .subtitle {
      color: #f4c44e;
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .lights {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 15px 0;
    }

    .light {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f4c44e;
      box-shadow: 0 0 15px #f4c44e;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .team {
      position: relative;
      min-height: 235px;
      padding: 22px;
      border-radius: 22px;
      color: #172326;
      box-shadow: 0 15px 35px rgba(0,0,0,.25);
      overflow: hidden;
      transition: transform .2s;
    }

    .team:nth-child(1) {
      background: linear-gradient(145deg,#f5efe3,#e7d6b6);
    }

    .team:nth-child(2) {
      background: linear-gradient(145deg,#dff1ef,#b7d9d4);
    }

    .team:nth-child(3) {
      background: linear-gradient(145deg,#f1e5f5,#d7c0e1);
    }

    .team:nth-child(4) {
      background: linear-gradient(145deg,#f7e4cf,#e8b98f);
    }

    .team.leading {
      transform: translateY(-4px);
      box-shadow: 0 18px 45px rgba(244,196,78,.4);
      border: 4px solid #f4c44e;
    }

    .leading::after {
      content: "LEADING";
      position: absolute;
      right: -35px;
      top: 18px;
      transform: rotate(35deg);
      background: #f4c44e;
      padding: 7px 45px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .team-number {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: .55;
      font-weight: bold;
    }

    .team-name {
      font-size: clamp(24px, 4vw, 34px);
      font-weight: 900;
      margin-top: 5px;
    }

    .icon {
      font-size: 35px;
      margin-bottom: 5px;
    }

    .score {
      font-size: clamp(70px, 12vw, 105px);
      font-weight: 900;
      line-height: .9;
      letter-spacing: -6px;
      margin-top: 20px;
    }

    .points {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      opacity: .55;
      font-weight: bold;
    }

    .admin-area {
      text-align: center;
      margin-top: 25px;
    }

    button {
      border: none;
      cursor: pointer;
      font: inherit;
    }

    .update-button {
      background: #f4c44e;
      color: #172326;
      padding: 14px 24px;
      border-radius: 999px;
      font-weight: 900;
      box-shadow: 0 7px 18px rgba(0,0,0,.25);
    }

    .status {
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(550px, 100%);
      background: white;
      color: #172326;
      border-radius: 22px;
      padding: 25px;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 12px 0 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 2px solid #d5dedb;
      border-radius: 10px;
      font-size: 16px;
    }

    .score-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .save {
      flex: 1;
      background: #123f45;
      color: white;
      padding: 13px;
      border-radius: 10px;
      font-weight: bold;
    }

    .cancel {
      background: #e9eeee;
      padding: 13px 20px;
      border-radius: 10px;
      font-weight: bold;
    }

    .error {
      color: #b3261e;
      font-weight: bold;
      margin-top: 10px;
      min-height: 20px;
    }

    @media (max-width:700px) {
      .scoreboard {
        grid-template-columns: 1fr;
      }

      .team {
        min-height: 205px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="small-title">Community Group</div>

    <h1>GROUP KINGSBURY</h1>

    <div class="subtitle">
      Mini Games Scoreboard
    </div>

    <div class="lights">
      <span class="light"></span>
      <span class="light"></span>
      <span class="light"></span>
      <span class="light"></span>
      <span class="light"></span>
    </div>
  </header>

  <div class="scoreboard" id="scoreboard"></div>

  <div class="admin-area">

    <button class="update-button" id="updateButton">
      🔐 Update Scores
    </button>

    <div class="status" id="status">
      ● Connecting to live scoreboard...
    </div>

  </div>

</div>


<!-- ADMIN MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <h2>Update Scores</h2>

    <p>
      Enter the admin code to update the scoreboard.
    </p>

    <label for="adminCode">
      Admin Code
    </label>

    <input
      id="adminCode"
      type="password"
      placeholder="Enter admin code"
      autocomplete="current-password"
    >

    <div class="score-inputs">

      <div>
        <label for="score1">Beach Bums</label>
        <input id="score1" type="number" min="0">
      </div>

      <div>
        <label for="score2">The Junkies</label>
        <input id="score2" type="number" min="0">
      </div>

      <div>
        <label for="score3">Rockstars</label>
        <input id="score3" type="number" min="0">
      </div>

      <div>
        <label for="score4">Volunteers</label>
        <input id="score4" type="number" min="0">
      </div>

    </div>

    <div class="error" id="error"></div>

    <div class="modal-buttons">

      <button class="cancel" id="cancelButton">
        Cancel
      </button>

      <button class="save" id="saveButton">
        Save Scores
      </button>

    </div>

  </div>

</div>


<script type="module">

  /* ==========================================
     FIREBASE IMPORTS
     ========================================== */

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
  }
    from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    onValue,
    set
  }
    from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";


  /* ==========================================
     YOUR FIREBASE CONFIGURATION
     ========================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyAPTgYCuEVr59Yi5NoGcc933djS3Evfbos",

    authDomain:
      "community-group-kingsbury.firebaseapp.com",

    databaseURL:
      "https://community-group-kingsbury-default-rtdb.firebaseio.com",

    projectId:
      "community-group-kingsbury",

    storageBucket:
      "community-group-kingsbury.firebasestorage.app",

    messagingSenderId:
      "432426114268",

    appId:
      "1:432426114268:web:5a449196e7493e129c2819"

  };


  /* ==========================================
     ADMIN ACCOUNT
     ========================================== */

  const ADMIN_EMAIL =
    "colerolandis@gmail.com";


  /* ==========================================
     INITIALIZE FIREBASE
     ========================================== */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const database =
    getDatabase(app);

  const scoresRef =
    ref(database, "scores");


  /* ==========================================
     TEAM INFORMATION
     ========================================== */

  const teams = [

    {
      name: "Beach Bums",
      icon: "🏖️",
      number: "Team 1",
      id: "beach"
    },

    {
      name: "The Junkies",
      icon: "🃏",
      number: "Team 2",
      id: "junkies"
    },

    {
      name: "Rockstars",
      icon: "🎸",
      number: "Team 3",
      id: "rockstars"
    },

    {
      name: "Volunteers",
      icon: "🙌",
      number: "Team 4",
      id: "volunteers"
    }

  ];


  /* ==========================================
     INITIAL SCORES
     ========================================== */

  const defaultScores = {

    beach: 50,

    junkies: 30,

    rockstars: 40,

    volunteers: 50

  };


  /* ==========================================
     RENDER SCOREBOARD
     ========================================== */

  function renderScores(scores) {

    const values =
      teams.map(team => {

        const value =
          Number(scores?.[team.id]);

        return Number.isFinite(value)
          ? value
          : defaultScores[team.id];

      });


    const highest =
      Math.max(...values);


    document.getElementById("scoreboard")
      .innerHTML =

      teams.map((team, index) => `

        <div class="team
          ${values[index] === highest ? "leading" : ""}">

          <div>

            <div class="icon">
              ${team.icon}
            </div>

            <div class="team-number">
              ${team.number}
            </div>

            <div class="team-name">
              ${team.name}
            </div>

          </div>

          <div>

            <div class="score">
              ${values[index]}
            </div>

            <div class="points">
              Points
            </div>

          </div>

        </div>

      `).join("");


    document.getElementById("score1").value =
      values[0];

    document.getElementById("score2").value =
      values[1];

    document.getElementById("score3").value =
      values[2];

    document.getElementById("score4").value =
      values[3];

  }


  /* ==========================================
     SHOW DEFAULT SCORES
     ========================================== */

  renderScores(defaultScores);


  /* ==========================================
     LISTEN FOR LIVE FIREBASE UPDATES
     ========================================== */

  onValue(

    scoresRef,

    snapshot => {

      const scores =
        snapshot.val();

      renderScores(
        scores || defaultScores
      );

      document.getElementById("status")
        .textContent =
        "● LIVE • Scores sync automatically";

    },

    error => {

      console.error(error);

      document.getElementById("status")
        .textContent =
        "● Unable to connect to scoreboard";

    }

  );


  /* ==========================================
     OPEN ADMIN WINDOW
     ========================================== */

  const modal =
    document.getElementById("modal");


  document.getElementById("updateButton")
    .onclick = () => {

      document.getElementById("error")
        .textContent = "";

      modal.classList.add("show");

    };


  /* ==========================================
     CLOSE ADMIN WINDOW
     ========================================== */

  document.getElementById("cancelButton")
    .onclick = () => {

      modal.classList.remove("show");

      document.getElementById("adminCode")
        .value = "";

    };


  /* ==========================================
     SAVE NEW SCORES
     ========================================== */

  document.getElementById("saveButton")
    .onclick = async () => {

      const code =
        document.getElementById("adminCode")
          .value;


      const error =
        document.getElementById("error");


      if (!code) {

        error.textContent =
          "Enter the admin code.";

        return;

      }


      const scores = {

        beach:
          Math.max(
            0,
            Number(
              document.getElementById("score1").value
            ) || 0
          ),

        junkies:
          Math.max(
            0,
            Number(
              document.getElementById("score2").value
            ) || 0
          ),

        rockstars:
          Math.max(
            0,
            Number(
              document.getElementById("score3").value
            ) || 0
          ),

        volunteers:
          Math.max(
            0,
            Number(
              document.getElementById("score4").value
            ) || 0
          )

      };


      const saveButton =
        document.getElementById("saveButton");


      saveButton.disabled =
        true;

      saveButton.textContent =
        "Saving...";


      try {

        /*
         * Firebase checks the email + password.
         * Your password is NEVER stored in this file.
         */

        const credential =
          await signInWithEmailAndPassword(
            auth,
            ADMIN_EMAIL,
            code
          );


        if (
          credential.user.email !==
          ADMIN_EMAIL
        ) {

          throw new Error(
            "Unauthorized"
          );

        }


        /*
         * Write scores to Firebase.
         */

        await set(
          scoresRef,
          scores
        );


        /*
         * Log the admin back out.
         */

        await signOut(auth);


        document.getElementById("status")
          .textContent =
          "● SCORES SAVED • LIVE FOR EVERYONE";


        modal.classList.remove("show");


        document.getElementById("adminCode")
          .value = "";


      }

      catch (errorObject) {

        console.error(errorObject);

        error.textContent =
          "Incorrect admin code or unable to save.";

      }

      finally {

        saveButton.disabled =
          false;

        saveButton.textContent =
          "Save Scores";

      }

    };


  /* ==========================================
     CLOSE MODAL BY CLICKING OUTSIDE
     ========================================== */

  modal.addEventListener(
    "click",
    event => {

      if (
        event.target === modal
      ) {

        modal.classList.remove(
          "show"
        );

        document.getElementById("adminCode")
          .value = "";

      }

    }
  );

</script>

</body>
</html>
