<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#123f45"><title>Group Kingsbury — Mini Games</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at 20% 0%,rgba(244,196,78,.18),transparent 30%),linear-gradient(145deg,#071d21,#174c52 50%,#07181b)}.wrap{width:min(1120px,94vw);margin:auto;padding:22px 0 40px}header{text-align:center;margin-bottom:22px}.eyebrow{text-transform:uppercase;letter-spacing:4px;font-weight:900;opacity:.8}h1{margin:5px 0;font-size:clamp(40px,8vw,78px);line-height:.9;letter-spacing:-4px;text-shadow:0 5px 0 #000}.subtitle{color:#f4c44e;font-weight:900;letter-spacing:4px;text-transform:uppercase}.lights{display:flex;justify-content:center;gap:18px;margin:15px}.light{width:9px;height:9px;border-radius:50%;background:#f4c44e;box-shadow:0 0 15px #f4c44e}.board{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.team{position:relative;min-height:280px;border-radius:18px;overflow:hidden;border:4px solid #f4c44e;box-shadow:0 18px 40px rgba(0,0,0,.38);background-size:cover;background-position:center;transition:transform .2s,box-shadow .2s}.team:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 24px 48px rgba(0,0,0,.5)}.team:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.22) 50%,rgba(0,0,0,.82))}.team-content{position:absolute;inset:0;padding:18px;display:flex;flex-direction:column;justify-content:flex-end}.team-label{display:inline-block;align-self:flex-start;background:rgba(0,0,0,.65);border:2px solid #f4c44e;color:#fff;padding:7px 11px;border-radius:9px;text-transform:uppercase;font-size:11px;letter-spacing:2px;font-weight:900}.live-score{margin-top:8px;align-self:flex-start;min-width:155px;text-align:center;padding:8px 18px 10px;border-radius:14px;background:rgba(7,29,33,.92);border:3px solid #fff;color:#fff;font-size:clamp(55px,9vw,88px);font-weight:1000;line-height:.85;letter-spacing:-4px;text-shadow:0 3px 0 #000}.points{font-size:10px;letter-spacing:3px;font-weight:900;text-align:center;margin-top:7px}.leading{box-shadow:0 0 0 4px #f4c44e,0 24px 55px rgba(244,196,78,.4)}.leading .team-content:after{content:"👑 LEADING";position:absolute;right:12px;top:12px;background:#f4c44e;color:#172326;padding:9px 12px;border-radius:999px;font-weight:1000;font-size:12px;letter-spacing:1px;box-shadow:0 4px 10px #0008}.admin{text-align:center;margin-top:24px}.update{background:#f4c44e;color:#172326;border:0;border-radius:999px;padding:15px 25px;font-weight:1000;box-shadow:0 8px 18px #0006;cursor:pointer}.status{text-align:center;margin-top:10px;font-size:13px;opacity:.8}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.box{width:min(560px,100%);background:#fff;color:#172326;border-radius:22px;padding:25px;box-shadow:0 25px 70px #0009}.box h2{margin-top:0}.box label{display:block;font-weight:900;margin:12px 0 5px}.box input{width:100%;padding:13px;border:2px solid #d5dedb;border-radius:10px;font-size:16px}.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;margin-top:20px}.save{flex:1;background:#123f45;color:#fff;border:0;border-radius:10px;padding:13px;font-weight:900}.cancel{background:#e9eeee;border:0;border-radius:10px;padding:13px 20px;font-weight:900}.error{color:#b3261e;font-weight:900;min-height:20px;margin-top:10px}@media(max-width:700px){.board{grid-template-columns:1fr}.team{min-height:245px}.wrap{padding-top:14px}} </style></head><body><main class="wrap"><header><div class="eyebrow">Community Group</div><h1>GROUP KINGSBURY</h1><div class="subtitle">Mini Games Scoreboard</div><div class="lights"><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span></div></header><section class="board" id="board"></section><div class="admin"><button class="update" id="update">🔐 Update Scores</button><div class="status" id="status">● Connecting to live scoreboard...</div></div></main><div class="modal" id="modal"><div class="box"><h2>Update Scores</h2><p>Enter the admin code to update the live scoreboard.</p><label>Admin Code</label><input id="code" type="password" autocomplete="current-password"><div class="scores"><div><label>Beach Bums</label><input id="s1" type="number" min="0"></div><div><label>The Junkies</label><input id="s2" type="number" min="0"></div><div><label>Rockstars</label><input id="s3" type="number" min="0"></div><div><label>Volunteers</label><input id="s4" type="number" min="0"></div></div><div class="error" id="error"></div><div class="actions"><button class="cancel" id="cancel">Cancel</button><button class="save" id="save">Save Scores</button></div></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";import{getDatabase,ref,onValue,set}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";const firebaseConfig={apiKey:"AIzaSyAPTgYCuEVr59Yi5NoGcc933djS3Evfbos",authDomain:"community-group-kingsbury.firebaseapp.com",databaseURL:"https://community-group-kingsbury-default-rtdb.firebaseio.com",projectId:"community-group-kingsbury",storageBucket:"community-group-kingsbury.firebasestorage.app",messagingSenderId:"432426114268",appId:"1:432426114268:web:5a449196e7493e129c2819"};const ADMIN_EMAIL="colerolandis@gmail.com";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),scoresRef=ref(db,"scores");const teams=[{name:"Beach Bums",id:"beach",image:"images/beach-bums.jpg"},{name:"The Junkies",id:"junkies",image:"images/the-junkies.jpg"},{name:"Rockstars",id:"rockstars",image:"images/rockstars.jpg"},{name:"Volunteers",id:"volunteers",image:"images/volunteers.jpg"}],defaults={beach:50,junkies:30,rockstars:40,volunteers:50};function render(scores){const vals=teams.map(t=>Number.isFinite(Number(scores?.[t.id]))?Number(scores[t.id]):defaults[t.id]),max=Math.max(...vals);document.getElementById("board").innerHTML=teams.map((t,i)=>`<article class="team ${vals[i]===max?"leading":""}" style="background-image:url('${t.image}')"><div class="team-content"><div class="team-label">${t.name}</div><div class="live-score">${vals[i]}<div class="points">POINTS</div></div></div></article>`).join("");[1,2,3,4].forEach((n,i)=>document.getElementById("s"+n).value=vals[i])}render(defaults);onValue(scoresRef,s=>{render(s.val()||defaults);document.getElementById("status").textContent="● LIVE • Scores sync automatically"},()=>document.getElementById("status").textContent="● Unable to connect to scoreboard");const modal=document.getElementById("modal");document.getElementById("update").onclick=()=>{document.getElementById("error").textContent="";modal.classList.add("show")};document.getElementById("cancel").onclick=()=>{modal.classList.remove("show");document.getElementById("code").value=""};document.getElementById("save").onclick=async()=>{const code=document.getElementById("code").value,error=document.getElementById("error");if(!code){error.textContent="Enter the admin code.";return}const scores={beach:Math.max(0,Number(document.getElementById("s1").value)||0),junkies:Math.max(0,Number(document.getElementById("s2").value)||0),rockstars:Math.max(0,Number(document.getElementById("s3").value)||0),volunteers:Math.max(0,Number(document.getElementById("s4").value)||0)};const btn=document.getElementById("save");btn.disabled=true;btn.textContent="Saving...";try{const cred=await signInWithEmailAndPassword(auth,ADMIN_EMAIL,code);await set(scoresRef,scores);await signOut(auth);document.getElementById("status").textContent="● SCORES SAVED • LIVE FOR EVERYONE";modal.classList.remove("show");document.getElementById("code").value=""}catch(e){console.error(e);error.textContent="Incorrect admin code or unable to save."}finally{btn.disabled=false;btn.textContent="Save Scores"}};modal.onclick=e=>{if(e.target===modal){modal.classList.remove("show");document.getElementById("code").value=""}};</script></body></html>
